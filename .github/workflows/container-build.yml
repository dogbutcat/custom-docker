name: Build and Push to GHCR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '*-xray' ]
    paths:
      - 'Dockerfile'
      - 'script/**'
      - '.github/workflows/container-build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/docker-sshd-shadowsocks

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version from Dockerfile
      id: version
      run: |
        VERSION=$(grep -E '^ENV VERSION=' Dockerfile | head -1 | cut -d'=' -f2)
        XRAY_VER=$(grep -E '^ENV XRAY_BINARY=' Dockerfile | head -1 | cut -d'=' -f2)
        echo "version=${VERSION}-xray" >> $GITHUB_OUTPUT
        echo "xray_version=${XRAY_VER}" >> $GITHUB_OUTPUT
        echo "Detected VERSION=${VERSION}, XRAY_BINARY=${XRAY_VER}"

    - name: Set up QEMU for multi-platform builds
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_NAME) || github.ref == 'refs/heads/master' && format('{0}:latest', env.IMAGE_NAME) || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
