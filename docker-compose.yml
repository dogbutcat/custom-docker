# Build and run the local 7.2.0 image with persistent generated identities.
services:
  v2ray:
    image: local/docker-sshd-shadowsocks:7.2.0-xray
    build: .
    pull_policy: never
    ports:
      - "443:443/tcp"
      - "8443:8443/tcp"
    volumes:
      - ./keys:/opt/xray/keys
      # Optional full configuration override:
      # - ./config:/opt/xray/config:ro
    restart: unless-stopped
